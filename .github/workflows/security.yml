name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 3 * * 2"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip_audit . --strict
      - run: |
          git grep -nE "(api[_-]?key|password|secret|token)[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9._~+/=-]{12,}" -- . && exit 1 || exit 0
