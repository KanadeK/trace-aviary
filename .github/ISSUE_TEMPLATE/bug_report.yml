name: Bug report
description: Report a reproducible Trace Aviary defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: Paste redacted logs or describe the fixture that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
